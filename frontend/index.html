<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>KoinPlay Store</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',900:'#1e3a8a' }}}}
    }
  </script>
  <style>
    body{background:#f8fafc}.glass{backdrop-filter:blur(16px);background:rgba(255,255,255,.8)}
    .hero-grid{background-image:linear-gradient(rgba(59,130,246,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.06) 1px,transparent 1px);background-size:24px 24px}
    .fade-in{animation:fade .35s ease}.floaty{animation:floaty 4s ease-in-out infinite}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} @keyframes floaty{50%{transform:translateY(-5px)}}
  </style>
</head>
<body class="text-slate-900">
<div id="app"></div>
<div id="toast" class="fixed bottom-5 right-5 z-[80] hidden max-w-sm"></div>

<script>
const APP_CONFIG = { API_BASE: '/api', APP_NAME:'KoinPlay Store' };
const state = { token: localStorage.getItem('kp_token') || '', user:null, route:'home', products:[], promos:[], transactions:[], notifications:[], payment:null, admin:null, loading:false, selectedProduct:null };

const $ = s => document.querySelector(s);
const money = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmtDate = d => d ? new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}) : '-';
const statusClass = s => ({Pending:'bg-amber-100 text-amber-700',Disetujui:'bg-blue-100 text-blue-700',Ditolak:'bg-rose-100 text-rose-700',Selesai:'bg-emerald-100 text-emerald-700'}[s]||'bg-slate-100 text-slate-600');

async function api(action, payload={}, method='POST') {
  const body = {...payload, action};
  if(state.token) body.token = state.token;
  const opts = {method, headers:{'Content-Type':'application/json'}};
  if(method !== 'GET') opts.body = JSON.stringify(body);
  const url = method==='GET' ? `${APP_CONFIG.API_BASE}/${action}${Object.keys(payload).length ? '?' + new URLSearchParams(payload) : ''}` : `${APP_CONFIG.API_BASE}/${action}`;
  const r = await fetch(url,opts);
  const data = await r.json().catch(()=>({ok:false,error:'Response tidak valid'}));
  if(!data.ok) throw new Error(data.error||'Terjadi kesalahan');
  return data.data;
}
function toast(msg,type='success') { const el=$('#toast'); el.className=`fixed bottom-5 right-5 z-[80] max-w-sm rounded-2xl px-4 py-3 shadow-2xl ${type==='error'?'bg-rose-600':'bg-slate-900'} text-white`; el.textContent=msg; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'),3500); }
function navigate(route) { state.route=route; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function setLoading(v){state.loading=v; render();}

async function bootstrap(){
  if(state.token){ try { state.user=(await api('me',{},'GET')).user; await loadUserData(); } catch(e){ state.token=''; localStorage.removeItem('kp_token'); } }
  render();
}
async function loadUserData(){
  const [products,promos,tx,profile,notes]=await Promise.all([api('products',{},'GET'),api('promotions',{},'GET'),api('transactions',{},'GET'),api('profile',{},'GET'),api('notifications',{},'GET')]);
  state.products=products; state.promos=promos; state.transactions=tx; state.payment=profile.payment; state.notifications=notes;
}
async function refresh(){ try{if(state.token) await loadUserData(); render();}catch(e){toast(e.message,'error');}}

function shell(content){
  const logged=!!state.user;
  return `<div class="min-h-screen hero-grid">
    <header class="sticky top-0 z-50 border-b border-slate-200/80 glass">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
        <button onclick="navigate('${logged&&state.user.role==='admin'?'admin-dashboard':'home'}')" class="flex items-center gap-3"><div class="floaty grid h-10 w-10 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-violet-600 text-white font-black">KP</div><div class="text-left"><div class="font-black tracking-tight">KoinPlay</div><div class="text-[10px] uppercase tracking-[.25em] text-slate-500">Game Store</div></div></button>
        ${logged?`<nav class="hidden gap-5 md:flex items-center text-sm font-semibold"><button onclick="navigate('home')">Beranda</button><button onclick="navigate('products')">Produk</button><button onclick="navigate('history')">Riwayat</button><button onclick="navigate('profile')">Profil</button>${state.user.role==='admin'?`<button onclick="navigate('admin-dashboard')" class="text-brand-700">Admin</button>`:''}</nav>`:''}
        <div class="flex items-center gap-2">${logged?`<button onclick="navigate('notifications')" class="relative rounded-xl border bg-white px-3 py-2">🔔${state.notifications.filter(x=>!String(x.read).toLowerCase().includes('true')).length?`<span class="absolute -right-1 -top-1 grid h-5 w-5 place-items-center rounded-full bg-rose-500 text-[10px] text-white">${Math.min(9,state.notifications.filter(x=>!boolClient(x.read)).length)}</span>`:''}</button><button onclick="logout()" class="rounded-xl bg-slate-900 px-3 py-2 text-sm font-bold text-white">Keluar</button>`:`<button onclick="navigate('login')" class="rounded-xl border bg-white px-3 py-2 text-sm font-bold">Masuk</button><button onclick="navigate('register')" class="rounded-xl bg-slate-900 px-3 py-2 text-sm font-bold text-white">Daftar</button>`}</div>
      </div>
    </header>
    <main>${content}</main>
    <footer class="border-t bg-white/80"><div class="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-8 text-sm text-slate-500 md:flex-row md:justify-between"><div>© ${new Date().getFullYear()} KoinPlay Store</div><div>Digital game top-up • QRIS • Bank • E-Wallet</div></div></footer>
  </div>`;
}
function boolClient(v){return v===true||String(v).toLowerCase()==='true'||v===1||String(v)==='1'}

function home(){ const hero=state.products.slice(0,3); return shell(`<section class="mx-auto max-w-7xl px-4 py-12 md:py-20"><div class="grid gap-8 lg:grid-cols-[1.2fr_.8fr] items-center"><div><span class="inline-flex rounded-full bg-brand-100 px-3 py-1 text-xs font-black uppercase tracking-widest text-brand-700">Fast • Aman • Profesional</span><h1 class="mt-5 text-4xl font-black tracking-tight sm:text-6xl">Top up koin game <span class="text-brand-600">lebih simpel.</span></h1><p class="mt-5 max-w-2xl text-lg text-slate-600">Belanja koin BUSSID, BUSSIN, dan TRUCKSID dengan checkout cepat dan pembayaran yang jelas.</p><div class="mt-8 flex flex-wrap gap-3"><button onclick="navigate('products')" class="rounded-2xl bg-slate-900 px-5 py-3 font-bold text-white shadow-lg">Jelajahi Produk</button>${state.user?'':'<button onclick="navigate(\'register\')" class="rounded-2xl border bg-white px-5 py-3 font-bold">Buat Akun</button>'}</div></div><div class="rounded-[2rem] border bg-white p-6 shadow-2xl shadow-blue-100"><div class="rounded-[1.5rem] bg-gradient-to-br from-blue-600 via-violet-600 to-fuchsia-600 p-6 text-white"><div class="text-sm font-semibold opacity-80">KoinPlay Store</div><div class="mt-20 text-4xl font-black">GAME CREDIT</div><div class="mt-2 text-white/70">Instant checkout • Proof upload • Admin approval</div></div></div></div></section><section class="mx-auto max-w-7xl px-4 pb-16"><div class="mb-6 flex items-end justify-between"><div><div class="text-sm font-bold text-brand-600">Pilihan favorit</div><h2 class="text-2xl font-black">Produk populer</h2></div><button onclick="navigate('products')" class="text-sm font-bold text-brand-700">Lihat semua →</button></div><div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${hero.map(cardProduct).join('')}</div></section>`); }
function cardProduct(p){ return `<article class="group overflow-hidden rounded-3xl border bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl"><div class="aspect-[4/3] overflow-hidden bg-slate-100"><img src="${esc(p.imageUrl||'https://placehold.co/800x600?text=Game')}" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" alt="${esc(p.name)}"></div><div class="p-5"><div class="mb-2 text-xs font-black uppercase tracking-widest text-brand-600">${esc(p.game)}</div><h3 class="font-black">${esc(p.name)}</h3><div class="mt-3 flex items-center justify-between"><div class="text-lg font-black">${money(p.price)}</div><button onclick="startCheckout('${esc(p.productId)}')" class="rounded-xl bg-slate-900 px-3 py-2 text-sm font-bold text-white">Beli</button></div></div></article>`; }
function products(){return shell(`<section class="mx-auto max-w-7xl px-4 py-10 fade-in"><div class="mb-8 flex flex-col gap-3 md:flex-row md:items-end md:justify-between"><div><div class="text-sm font-bold text-brand-600">Marketplace</div><h1 class="text-3xl font-black">Pilih paket koin</h1></div><div class="text-sm text-slate-500">${state.products.length} produk aktif</div></div><div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">${state.products.map(cardProduct).join('')||empty('Belum ada produk aktif.')}</div></section>`);}
function promoBlock(){return state.promos.length?`<section class="mx-auto max-w-7xl px-4 pb-10"><div class="mb-4 text-sm font-bold text-brand-600">Promo aktif</div><div class="grid gap-5 md:grid-cols-2">${state.promos.map(p=>`<article class="overflow-hidden rounded-3xl border bg-white"><img src="${esc(p.bannerUrl||'https://placehold.co/1200x360')}" class="h-44 w-full object-cover"><div class="p-5"><div class="text-lg font-black">${esc(p.title)}</div><div class="mt-1 text-sm text-slate-600">${esc(p.description)}</div><div class="mt-3 text-xs text-slate-400">Berlaku ${fmtDate(p.startAt)} — ${fmtDate(p.endAt)}</div></div></article>`).join('')}</div></section>`:'';}
function login(){return authLayout('Masuk','Login ke akun KoinPlay Store',`<form onsubmit="event.preventDefault();loginSubmit()" class="space-y-4"><input id="email" type="email" required placeholder="Email" class="input"><input id="password" type="password" required placeholder="Password" class="input"><button class="w-full rounded-2xl bg-slate-900 py-3 font-bold text-white">Masuk</button></form><div class="mt-5 text-center text-sm text-slate-500">Belum punya akun? <button onclick="navigate('register')" class="font-bold text-brand-700">Daftar</button></div>`)}
function register(){return authLayout('Buat akun','Mulai belanja koin dalam beberapa langkah',`<form onsubmit="event.preventDefault();registerSubmit()" class="space-y-4"><input id="name" required placeholder="Nama" class="input"><input id="email" type="email" required placeholder="Email" class="input"><input id="password" type="password" minlength="8" required placeholder="Password minimal 8 karakter" class="input"><button class="w-full rounded-2xl bg-slate-900 py-3 font-bold text-white">Daftar</button></form><div class="mt-5 text-center text-sm text-slate-500">Sudah punya akun? <button onclick="navigate('login')" class="font-bold text-brand-700">Masuk</button></div>`)}
function authLayout(title,sub,form){return `<div class="grid min-h-[80vh] place-items-center px-4 py-12"><div class="w-full max-w-md rounded-[2rem] border bg-white p-7 shadow-xl"><div class="mb-7"><div class="text-sm font-black text-brand-600">KoinPlay Store</div><h1 class="mt-1 text-3xl font-black">${title}</h1><p class="mt-2 text-slate-500">${sub}</p></div>${form}</div></div>`}
function dashboard(){const t=state.transactions[0]; return shell(`<section class="mx-auto max-w-7xl px-4 py-10 fade-in"><div class="rounded-[2rem] bg-gradient-to-br from-slate-900 via-slate-800 to-brand-900 p-7 text-white shadow-xl"><div class="text-sm text-white/70">Selamat datang</div><h1 class="mt-1 text-3xl font-black">${esc(state.user.name)}</h1><p class="mt-2 text-white/70">Akun ${esc(state.user.email)}</p></div><div class="mt-7 grid gap-5 md:grid-cols-3"><stat title="Transaksi" value="${state.transactions.length}"/><stat title="Notif belum dibaca" value="${state.notifications.filter(x=>!boolClient(x.read)).length}"/><stat title="Status terakhir" value="${t?esc(t.status):'Belum ada'}"/></div><div class="mt-8 grid gap-6 lg:grid-cols-[1.1fr_.9fr]"><div class="rounded-3xl border bg-white p-6"><div class="flex justify-between"><h2 class="font-black">Pembelian terakhir</h2><button onclick="navigate('history')" class="text-sm font-bold text-brand-700">Lihat semua</button></div>${t?`<div class="mt-5 flex items-center justify-between rounded-2xl bg-slate-50 p-4"><div><div class="font-black">${esc(t.productName)}</div><div class="mt-1 text-sm text-slate-500">${fmtDate(t.createdAt)} • ${esc(t.paymentMethod)}</div></div><div class="text-right"><div class="font-black">${money(t.amount)}</div><span class="mt-1 inline-flex rounded-full px-2 py-1 text-xs font-bold ${statusClass(t.status)}">${esc(t.status)}</span></div></div>`:empty('Belum ada transaksi')}</div><div class="rounded-3xl border bg-white p-6"><h2 class="font-black">Promo aktif</h2>${state.promos[0]?`<div class="mt-4 rounded-2xl bg-brand-50 p-4"><div class="font-black">${esc(state.promos[0].title)}</div><div class="mt-1 text-sm text-slate-600">${esc(state.promos[0].description)}</div></div>`:empty('Belum ada promo')}</div></div></section>`);}
function stat({title,value}){return `<div class="rounded-3xl border bg-white p-6"><div class="text-sm text-slate-500">${title}</div><div class="mt-2 text-2xl font-black">${value}</div></div>`}
function empty(text){return `<div class="rounded-2xl bg-slate-50 p-5 text-sm text-slate-500">${text}</div>`}
function history(){return shell(`<section class="mx-auto max-w-7xl px-4 py-10"><div class="mb-7"><div class="text-sm font-bold text-brand-600">Aktivitas akun</div><h1 class="text-3xl font-black">Riwayat Pembelian</h1></div><div class="overflow-hidden rounded-3xl border bg-white"><div class="hidden grid-cols-[1.4fr_.8fr_.7fr_.8fr] gap-4 border-b px-5 py-4 text-xs font-black uppercase tracking-widest text-slate-400 md:grid"><div>Pesanan</div><div>Metode</div><div>Status</div><div class="text-right">Nominal</div></div>${state.transactions.map(t=>`<button onclick="showTransaction('${esc(t.transactionId)}')" class="grid w-full gap-4 border-b px-5 py-4 text-left hover:bg-slate-50 md:grid-cols-[1.4fr_.8fr_.7fr_.8fr] md:items-center"><div><div class="font-black">${esc(t.productName)}</div><div class="text-xs text-slate-500">${esc(t.transactionId)} • ${fmtDate(t.createdAt)}</div></div><div class="text-sm font-semibold">${esc(t.paymentMethod)}</div><div><span class="inline-flex rounded-full px-2 py-1 text-xs font-bold ${statusClass(t.status)}">${esc(t.status)}</span></div><div class="font-black md:text-right">${money(t.amount)}</div></button>`).join('')||empty('Belum ada transaksi')}</div></section>`);}
function profile(){return shell(`<section class="mx-auto max-w-3xl px-4 py-10"><div class="rounded-3xl border bg-white p-6"><div class="text-sm font-bold text-brand-600">Akun</div><h1 class="text-3xl font-black">Profil</h1><form class="mt-7 space-y-4" onsubmit="event.preventDefault();saveProfile()"><label class="block"><span class="text-sm font-bold">Nama</span><input id="pname" class="input mt-1" value="${esc(state.user.name)}"></label><label class="block"><span class="text-sm font-bold">Email</span><input disabled class="input mt-1 bg-slate-50" value="${esc(state.user.email)}"></label><label class="block"><span class="text-sm font-bold">Password baru</span><input id="ppass" type="password" minlength="8" class="input mt-1" placeholder="Kosongkan bila tidak diubah"></label><button class="rounded-2xl bg-slate-900 px-5 py-3 font-bold text-white">Simpan perubahan</button></form></div></section>`);}
function notifications(){return shell(`<section class="mx-auto max-w-3xl px-4 py-10"><div class="mb-6"><div class="text-sm font-bold text-brand-600">Inbox</div><h1 class="text-3xl font-black">Notifikasi</h1></div><div class="space-y-3">${state.notifications.map(n=>`<button onclick="readNotif('${esc(n.notificationId)}')" class="w-full rounded-2xl border bg-white p-5 text-left ${boolClient(n.read)?'opacity-60':'ring-2 ring-brand-100'}"><div class="flex justify-between gap-4"><div><div class="font-black">${esc(n.title)}</div><div class="mt-1 text-sm text-slate-600">${esc(n.message)}</div></div><div class="text-xs text-slate-400">${fmtDate(n.createdAt)}</div></div></button>`).join('')||empty('Belum ada notifikasi')}</div></section>`);}
function checkout(){if(!state.selectedProduct)return products(); const p=state.selectedProduct; return shell(`<section class="mx-auto max-w-4xl px-4 py-10"><div class="mb-7"><div class="text-sm font-bold text-brand-600">Checkout</div><h1 class="text-3xl font-black">Konfirmasi pesanan</h1></div><div class="grid gap-6 lg:grid-cols-[1fr_.8fr]"><div class="rounded-3xl border bg-white p-6"><div class="flex gap-4"><img src="${esc(p.imageUrl)}" class="h-24 w-32 rounded-2xl object-cover"><div><div class="text-xs font-black text-brand-600">${esc(p.game)}</div><h2 class="mt-1 text-xl font-black">${esc(p.name)}</h2><div class="mt-2 text-slate-600">${money(p.price)}</div></div></div><div class="mt-7"><label class="text-sm font-bold">Metode pembayaran</label><select id="paymentMethod" class="input mt-1"><option value="QRIS">QRIS</option><option value="BANK">Transfer Bank</option><option value="DANA">DANA</option><option value="OVO">OVO</option><option value="GOPAY">GoPay</option><option value="SHOPEEPAY">ShopeePay</option></select></div><button onclick="createCheckout()" class="mt-6 w-full rounded-2xl bg-slate-900 py-3 font-bold text-white">Buat Invoice</button></div><div class="rounded-3xl bg-slate-900 p-6 text-white"><div class="text-sm text-white/60">Ringkasan</div><div class="mt-5 flex justify-between text-sm"><span>Produk</span><span>${esc(p.name)}</span></div><div class="mt-3 flex justify-between text-sm"><span>Harga</span><span>${money(p.price)}</span></div><div class="my-5 border-t border-white/10"></div><div class="flex justify-between text-lg font-black"><span>Total</span><span>${money(p.price)}</span></div></div></div></section>`);}
function paymentPage(tx){const pay=state.payment||{}; const method=tx.paymentMethod; let info=''; if(method==='QRIS') info=`<div><div class="text-sm font-bold">Scan QRIS</div><img src="${esc(pay.qrisImageUrl)}" class="mx-auto mt-4 h-64 w-64 rounded-2xl border object-contain bg-white p-2"></div>`; else if(method==='BANK') info=`<div class="rounded-2xl bg-slate-50 p-4"><div class="text-sm text-slate-500">Transfer ke</div><div class="mt-2 text-xl font-black">${esc(pay.bank?.name)}</div><div class="mt-1 text-2xl font-black tracking-wider">${esc(pay.bank?.account)}</div><div class="mt-1 text-sm">${esc(pay.bank?.holder)}</div></div>`; else info=`<div class="rounded-2xl bg-slate-50 p-4"><div class="text-sm text-slate-500">Nomor ${esc(method)}</div><div class="mt-2 text-2xl font-black tracking-wider">${esc(pay.ewallet?.[method]||'-')}</div></div>`; return shell(`<section class="mx-auto max-w-4xl px-4 py-10"><div class="mb-7"><div class="text-sm font-bold text-brand-600">Pembayaran</div><h1 class="text-3xl font-black">${esc(tx.transactionId)}</h1><div class="mt-2 text-slate-500">Total ${money(tx.amount)} • ${esc(tx.paymentMethod)}</div></div><div class="grid gap-6 lg:grid-cols-[.9fr_1.1fr]"><div class="rounded-3xl border bg-white p-6">${info}<div class="mt-6 rounded-2xl bg-amber-50 p-4 text-sm text-amber-800">Setelah transfer, upload bukti pembayaran. Admin akan memeriksa pesanan Anda.</div></div><div class="rounded-3xl border bg-white p-6"><h2 class="font-black">Upload bukti pembayaran</h2><input id="proof" type="file" accept="image/*,application/pdf" class="mt-4 block w-full rounded-2xl border p-3"><input id="reference" class="input mt-3" placeholder="Nomor referensi (opsional)"><textarea id="paymentNote" class="input mt-3 min-h-28" placeholder="Catatan pembayaran (opsional)"></textarea><button onclick="uploadProof('${esc(tx.transactionId)}')" class="mt-4 w-full rounded-2xl bg-slate-900 py-3 font-bold text-white">Kirim Bukti</button></div></div></section>`);}
function transactionModal(t){return `<div id="modal" class="fixed inset-0 z-[100] grid place-items-center bg-slate-950/50 p-4"><div class="max-h-[90vh] w-full max-w-lg overflow-auto rounded-3xl bg-white p-6"><div class="flex justify-between"><div><div class="text-sm text-brand-600">Invoice</div><h2 class="text-2xl font-black">${esc(t.transactionId)}</h2></div><button onclick="closeModal()" class="h-9 w-9 rounded-full bg-slate-100">×</button></div><div class="mt-6 space-y-3 rounded-2xl bg-slate-50 p-4"><div class="flex justify-between"><span>Produk</span><b>${esc(t.productName)}</b></div><div class="flex justify-between"><span>Total</span><b>${money(t.amount)}</b></div><div class="flex justify-between"><span>Metode</span><b>${esc(t.paymentMethod)}</b></div><div class="flex justify-between"><span>Status</span><span class="rounded-full px-2 py-1 text-xs font-bold ${statusClass(t.status)}">${esc(t.status)}</span></div><div class="text-xs text-slate-500">Dibuat ${fmtDate(t.createdAt)}</div>${t.rejectionReason?`<div class="rounded-xl bg-rose-50 p-3 text-sm text-rose-700"><b>Alasan penolakan:</b> ${esc(t.rejectionReason)}</div>`:''}</div>${t.status==='Pending'&&!t.proofUrl?`<button onclick="closeModal();state.selectedProduct=null;navigate('payment')" class="mt-5 w-full rounded-2xl bg-slate-900 py-3 font-bold text-white">Upload pembayaran</button>`:''}</div></div>`}
function adminDashboard(){return shell(`<section class="mx-auto max-w-7xl px-4 py-10"><div class="mb-7 flex flex-col justify-between gap-3 md:flex-row md:items-end"><div><div class="text-sm font-bold text-brand-600">Back office</div><h1 class="text-3xl font-black">Dashboard Admin</h1></div><div class="flex flex-wrap gap-2"><button onclick="navigate('admin-products')" class="rounded-xl border bg-white px-3 py-2 text-sm font-bold">Produk</button><button onclick="navigate('admin-promos')" class="rounded-xl border bg-white px-3 py-2 text-sm font-bold">Promo</button><button onclick="navigate('admin-settings')" class="rounded-xl border bg-white px-3 py-2 text-sm font-bold">Pembayaran</button><button onclick="navigate('admin-logs')" class="rounded-xl border bg-white px-3 py-2 text-sm font-bold">Log</button></div></div><div id="admin-root">${empty('Memuat data admin...')}</div></section>`);}
async function loadAdmin(){try{state.admin=await api('admin/dashboard'); const d=state.admin; $('#admin-root').innerHTML=`<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">${stat({title:'Total transaksi',value:d.stats.totalTransactions})}${stat({title:'Pendapatan',value:money(d.stats.revenue)})}${stat({title:'Total user',value:d.stats.totalUsers})}${stat({title:'Pending',value:d.stats.pendingTransactions})}</div><div class="mt-6 grid gap-6 lg:grid-cols-[1.2fr_.8fr]"><div class="rounded-3xl border bg-white p-6"><div class="flex justify-between"><h2 class="font-black">Transaksi menunggu</h2><button onclick="refreshAdmin()" class="text-sm font-bold text-brand-700">Refresh</button></div><div class="mt-4 space-y-3">${d.pending.map(t=>`<div class="rounded-2xl border p-4"><div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between"><div><div class="font-black">${esc(t.productName)}</div><div class="text-xs text-slate-500">${esc(t.transactionId)} • ${esc(t.paymentMethod)} • ${fmtDate(t.createdAt)}</div>${t.proofUrl?`<a href="${esc(t.proofUrl)}" target="_blank" class="mt-2 inline-block text-sm font-bold text-brand-700">Lihat bukti</a>`:`<div class="mt-2 text-sm text-amber-700">Belum ada bukti pembayaran</div>`}</div><div class="flex gap-2"><button onclick="approve('${esc(t.transactionId)}')" class="rounded-xl bg-emerald-600 px-3 py-2 text-sm font-bold text-white">Approve</button><button onclick="rejectTx('${esc(t.transactionId)}')" class="rounded-xl bg-rose-600 px-3 py-2 text-sm font-bold text-white">Reject</button></div></div></div>`).join('')||empty('Tidak ada transaksi pending')}</div></div><div class="rounded-3xl border bg-white p-6"><h2 class="font-black">Produk terlaris</h2><div class="mt-3 text-3xl font-black">${esc(d.stats.bestseller)}</div><div class="mt-2 text-sm text-slate-500">Gunakan menu produk untuk mengelola katalog.</div></div></div>`;}catch(e){toast(e.message,'error');}}
async function refreshAdmin(){await loadAdmin();}
function adminProducts(){return shell(`<section class="mx-auto max-w-7xl px-4 py-10"><div class="flex justify-between items-end"><div><div class="text-sm font-bold text-brand-600">Katalog</div><h1 class="text-3xl font-black">Kelola Produk</h1></div><button onclick="showProductForm()" class="rounded-xl bg-slate-900 px-4 py-2 font-bold text-white">+ Produk</button></div><div id="admin-products-root" class="mt-7">${empty('Memuat...')}</div></section>`)}
async function loadAdminProducts(){const items=await api('admin/products'); $('#admin-products-root').innerHTML=`<div class="grid gap-5 md:grid-cols-2 xl:grid-cols-3">${items.map(p=>`<article class="overflow-hidden rounded-3xl border bg-white"><img src="${esc(p.imageUrl||'https://placehold.co/800x600')}" class="h-48 w-full object-cover"><div class="p-5"><div class="text-xs font-black text-brand-600">${esc(p.game)}</div><div class="mt-1 font-black">${esc(p.name)}</div><div class="mt-2 font-black">${money(p.price)}</div><div class="mt-4 flex gap-2"><button onclick='showProductForm(${JSON.stringify(p).replace(/'/g,"&#39;")})' class="flex-1 rounded-xl border px-3 py-2 text-sm font-bold">Edit</button><button onclick="deleteProduct('${esc(p.productId)}')" class="rounded-xl bg-rose-50 px-3 py-2 text-sm font-bold text-rose-700">Nonaktifkan</button></div></div></article>`).join('')}</div>`;}
function showProductForm(p=null){document.body.insertAdjacentHTML('beforeend',`<div id="formModal" class="fixed inset-0 z-[100] grid place-items-center bg-slate-950/50 p-4"><form onsubmit="event.preventDefault();saveProduct()" class="max-h-[90vh] w-full max-w-lg overflow-auto rounded-3xl bg-white p-6"><div class="flex justify-between"><h2 class="text-xl font-black">${p?'Edit':'Tambah'} Produk</h2><button type="button" onclick="closeFormModal()">✕</button></div><input id="f_productId" type="hidden" value="${esc(p?.productId||'')}"><input id="f_game" class="input mt-4" placeholder="Game, mis. BUSSID" value="${esc(p?.game||'BUSSID')}"><input id="f_name" class="input mt-3" placeholder="Nama produk" value="${esc(p?.name||'')}"><input id="f_coins" class="input mt-3" type="number" placeholder="Jumlah koin" value="${p?.coins||''}"><input id="f_price" class="input mt-3" type="number" placeholder="Harga" value="${p?.price||''}"><input id="f_imageUrl" class="input mt-3" placeholder="URL gambar" value="${esc(p?.imageUrl||'')}"><textarea id="f_desc" class="input mt-3 min-h-28" placeholder="Deskripsi">${esc(p?.description||'')}</textarea><label class="mt-3 flex items-center gap-2 text-sm"><input id="f_active" type="checkbox" ${p?.active!==false?'checked':''}> Aktif</label><button class="mt-5 w-full rounded-2xl bg-slate-900 py-3 font-bold text-white">Simpan</button></form></div>`)}
function adminPromos(){return shell(`<section class="mx-auto max-w-7xl px-4 py-10"><div class="flex justify-between items-end"><div><div class="text-sm font-bold text-brand-600">Campaign</div><h1 class="text-3xl font-black">Kelola Promo</h1></div><button onclick="showPromoForm()" class="rounded-xl bg-slate-900 px-4 py-2 font-bold text-white">+ Promo</button></div><div id="admin-promos-root" class="mt-7">${empty('Memuat...')}</div></section>`)}
async function loadAdminPromos(){const items=await api('admin/promos'); $('#admin-promos-root').innerHTML=`<div class="grid gap-5 md:grid-cols-2">${items.map(p=>`<article class="overflow-hidden rounded-3xl border bg-white"><img src="${esc(p.bannerUrl||'https://placehold.co/1200x360')}" class="h-40 w-full object-cover"><div class="p-5"><div class="font-black">${esc(p.title)}</div><div class="mt-1 text-sm text-slate-600">${esc(p.description)}</div><div class="mt-3 text-sm">Diskon: <b>${p.discountType==='percent'?p.discountValue+'%':money(p.discountValue)}</b></div><div class="mt-4 flex gap-2"><button onclick='showPromoForm(${JSON.stringify(p).replace(/'/g,"&#39;")})' class="rounded-xl border px-3 py-2 text-sm font-bold">Edit</button><button onclick="deletePromo('${esc(p.promoId)}')" class="rounded-xl bg-rose-50 px-3 py-2 text-sm font-bold text-rose-700">Nonaktifkan</button></div></div></article>`).join('')}</div>`;}
function adminSettings(){return shell(`<section class="mx-auto max-w-3xl px-4 py-10"><div class="mb-7"><div class="text-sm font-bold text-brand-600">Konfigurasi</div><h1 class="text-3xl font-black">Pengaturan Pembayaran</h1></div><div id="settings-root">${empty('Memuat...')}</div></section>`)}
async function loadSettings(){const p=await api('admin/settings'); $('#settings-root').innerHTML=`<form onsubmit="event.preventDefault();saveSettings()" class="rounded-3xl border bg-white p-6 space-y-4"><input id="s_qris" class="input" placeholder="URL gambar QRIS" value="${esc(p.qrisImageUrl||'')}"><div class="grid gap-3 md:grid-cols-3"><input id="s_bank" class="input" placeholder="Bank" value="${esc(p.bank?.name||'')}"><input id="s_account" class="input" placeholder="No. rekening" value="${esc(p.bank?.account||'')}"><input id="s_holder" class="input" placeholder="Atas nama" value="${esc(p.bank?.holder||'')}"></div><div class="grid gap-3 md:grid-cols-2"><input id="s_dana" class="input" placeholder="DANA" value="${esc(p.ewallet?.DANA||'')}"><input id="s_ovo" class="input" placeholder="OVO" value="${esc(p.ewallet?.OVO||'')}"><input id="s_gopay" class="input" placeholder="GoPay" value="${esc(p.ewallet?.GOPAY||'')}"><input id="s_shopee" class="input" placeholder="ShopeePay" value="${esc(p.ewallet?.SHOPEEPAY||'')}"></div><input id="s_folder" class="input" placeholder="Google Drive Folder ID bukti pembayaran" value=""><input id="s_support" class="input" placeholder="Kontak support" value="${esc(p.support||'')}"><button class="rounded-2xl bg-slate-900 px-5 py-3 font-bold text-white">Simpan Pengaturan</button></form>`}
function adminLogs(){return shell(`<section class="mx-auto max-w-7xl px-4 py-10"><div class="mb-7"><div class="text-sm font-bold text-brand-600">Audit trail</div><h1 class="text-3xl font-black">Log Aktivitas Admin</h1></div><div id="logs-root" class="rounded-3xl border bg-white p-5">${empty('Memuat...')}</div></section>`)}
async function loadLogs(){const items=await api('admin/logs'); $('#logs-root').innerHTML=`<div class="space-y-3">${items.map(x=>`<div class="rounded-2xl border p-4"><div class="flex justify-between gap-4"><div><div class="font-black">${esc(x.action)}</div><div class="text-xs text-slate-500">${esc(x.targetId)} • ${esc(x.details)}</div></div><div class="text-xs text-slate-400">${fmtDate(x.createdAt)}</div></div></div>`).join('')}</div>`;}

function render(){
  let content='';
  if(!state.user && !['home','products','login','register'].includes(state.route)) state.route='home';
  const r=state.route;
  if(r==='home') content=state.user?dashboard():`${home()}${promoBlock()}`; else if(r==='products') content=products(); else if(r==='login') content=login(); else if(r==='register') content=register(); else if(r==='dashboard') content=dashboard(); else if(r==='history') content=history(); else if(r==='profile') content=profile(); else if(r==='notifications') content=notifications(); else if(r==='checkout') content=checkout(); else if(r==='admin-dashboard') content=adminDashboard(); else if(r==='admin-products') content=adminProducts(); else if(r==='admin-promos') content=adminPromos(); else if(r==='admin-settings') content=adminSettings(); else if(r==='admin-logs') content=adminLogs(); else content=home();
  $('#app').innerHTML=content;
  if(r==='admin-dashboard') loadAdmin(); if(r==='admin-products') loadAdminProducts(); if(r==='admin-promos') loadAdminPromos(); if(r==='admin-settings') loadSettings(); if(r==='admin-logs') loadLogs();
}

async function loginSubmit(){try{setLoading(true); const d=await api('login',{email:$('#email').value,password:$('#password').value}); state.token=d.token; state.user=d.user; localStorage.setItem('kp_token',state.token); await loadUserData(); navigate(state.user.role==='admin'?'admin-dashboard':'home'); toast('Login berhasil.');}catch(e){toast(e.message,'error');}finally{setLoading(false);}}
async function registerSubmit(){try{setLoading(true); await api('register',{name:$('#name').value,email:$('#email').value,password:$('#password').value}); toast('Registrasi berhasil. Silakan login.'); navigate('login');}catch(e){toast(e.message,'error');}finally{setLoading(false);}}
async function logout(){try{if(state.token) await api('logout');}catch(e){} state.token='';state.user=null;localStorage.removeItem('kp_token');navigate('home');}
function startCheckout(id){ if(!state.user){toast('Silakan login terlebih dahulu.','error'); navigate('login'); return;} state.selectedProduct=state.products.find(x=>x.productId===id); navigate('checkout'); }
async function createCheckout(){try{const d=await api('checkout',{productId:state.selectedProduct.productId,paymentMethod:$('#paymentMethod').value}); state.selectedProduct=null; navigate('history'); const t=d.transaction; setTimeout(()=>{document.body.insertAdjacentHTML('beforeend',transactionModal(t));},100); await refresh();}catch(e){toast(e.message,'error');}}
async function uploadProof(id){const f=$('#proof').files[0]; if(!f){toast('Pilih file bukti pembayaran.','error');return;} if(f.size>3*1024*1024){toast('Maksimal 3 MB.','error');return;} const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);}); try{await api('upload-payment',{transactionId:id,fileName:f.name,mimeType:f.type,base64,reference:$('#reference').value,note:$('#paymentNote').value}); toast('Bukti pembayaran berhasil dikirim.'); await refresh(); navigate('history');}catch(e){toast(e.message,'error');}}
async function saveProfile(){try{const d=await api('update-profile',{name:$('#pname').value,password:$('#ppass').value}); state.user=d.user; toast('Profil diperbarui.');}catch(e){toast(e.message,'error');}}
async function readNotif(id){try{await api('mark-notification-read',{notificationId:id}); await refresh();}catch(e){toast(e.message,'error');}}
async function showTransaction(id){const t=state.transactions.find(x=>x.transactionId===id); if(t) document.body.insertAdjacentHTML('beforeend',transactionModal(t));}
function closeModal(){ $('#modal')?.remove(); }
function closeFormModal(){ $('#formModal')?.remove(); }
async function approve(id){try{await api('admin/approve',{transactionId:id,note:'Approved via dashboard'});toast('Pembayaran disetujui.');await refreshAdmin();}catch(e){toast(e.message,'error');}}
async function rejectTx(id){const reason=prompt('Alasan penolakan:'); if(!reason)return; try{await api('admin/reject',{transactionId:id,reason});toast('Pembayaran ditolak.');await refreshAdmin();}catch(e){toast(e.message,'error');}}
async function saveProduct(){try{const p={productId:$('#f_productId').value,game:$('#f_game').value,name:$('#f_name').value,coins:$('#f_coins').value,price:$('#f_price').value,imageUrl:$('#f_imageUrl').value,description:$('#f_desc').value,active:$('#f_active').checked};await api('admin/product/save',p);toast('Produk tersimpan.');closeFormModal();await loadAdminProducts();}catch(e){toast(e.message,'error');}}
async function deleteProduct(id){if(!confirm('Nonaktifkan produk ini?'))return;try{await api('admin/product/delete',{productId:id});toast('Produk dinonaktifkan.');await loadAdminProducts();}catch(e){toast(e.message,'error');}}
function showPromoForm(p=null){document.body.insertAdjacentHTML('beforeend',`<div id="formModal" class="fixed inset-0 z-[100] grid place-items-center bg-slate-950/50 p-4"><form onsubmit="event.preventDefault();savePromo()" class="w-full max-w-lg rounded-3xl bg-white p-6"><div class="flex justify-between"><h2 class="text-xl font-black">${p?'Edit':'Tambah'} Promo</h2><button type="button" onclick="closeFormModal()">✕</button></div><input id="pr_id" type="hidden" value="${esc(p?.promoId||'')}"><input id="pr_title" class="input mt-4" placeholder="Judul" value="${esc(p?.title||'')}"><input id="pr_banner" class="input mt-3" placeholder="URL banner" value="${esc(p?.bannerUrl||'')}"><textarea id="pr_desc" class="input mt-3 min-h-24" placeholder="Deskripsi">${esc(p?.description||'')}</textarea><div class="grid gap-3 md:grid-cols-2 mt-3"><select id="pr_type" class="input"><option value="fixed" ${p?.discountType==='fixed'?'selected':''}>Potongan Rupiah</option><option value="percent" ${p?.discountType==='percent'?'selected':''}>Persen</option></select><input id="pr_value" class="input" type="number" placeholder="Nilai diskon" value="${p?.discountValue||''}"></div><div class="grid gap-3 md:grid-cols-2 mt-3"><input id="pr_start" class="input" type="datetime-local" value="${p?localTime(p.startAt):''}"><input id="pr_end" class="input" type="datetime-local" value="${p?localTime(p.endAt):''}"></div><label class="mt-3 flex items-center gap-2 text-sm"><input id="pr_active" type="checkbox" ${p?.active!==false?'checked':''}> Aktif</label><button class="mt-5 w-full rounded-2xl bg-slate-900 py-3 font-bold text-white">Simpan</button></form></div>`)}
function localTime(v){try{const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}catch(e){return''}}
async function savePromo(){try{const p={promoId:$('#pr_id').value,title:$('#pr_title').value,bannerUrl:$('#pr_banner').value,description:$('#pr_desc').value,discountType:$('#pr_type').value,discountValue:$('#pr_value').value,startAt:new Date($('#pr_start').value).toISOString(),endAt:new Date($('#pr_end').value).toISOString(),active:$('#pr_active').checked};await api('admin/promo/save',p);toast('Promo tersimpan.');closeFormModal();await loadAdminPromos();}catch(e){toast(e.message,'error');}}
async function deletePromo(id){if(!confirm('Nonaktifkan promo ini?'))return;try{await api('admin/promo/delete',{promoId:id});toast('Promo dinonaktifkan.');await loadAdminPromos();}catch(e){toast(e.message,'error');}}
async function saveSettings(){try{await api('admin/settings/save',{QRIS_IMAGE_URL:$('#s_qris').value,BANK_NAME:$('#s_bank').value,BANK_ACCOUNT:$('#s_account').value,BANK_HOLDER:$('#s_holder').value,DANA_NUMBER:$('#s_dana').value,OVO_NUMBER:$('#s_ovo').value,GOPAY_NUMBER:$('#s_gopay').value,SHOPEEPAY_NUMBER:$('#s_shopee').value,PAYMENT_FOLDER_ID:$('#s_folder').value,SUPPORT_CONTACT:$('#s_support').value});toast('Pengaturan tersimpan.');}catch(e){toast(e.message,'error');}}

const style=document.createElement('style'); style.textContent='.input{display:block;width:100%;border:1px solid #e2e8f0;border-radius:1rem;padding:.8rem 1rem;outline:none;background:white}.input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(59,130,246,.1)}'; document.head.appendChild(style);
bootstrap();
</script>
</body>
</html>
