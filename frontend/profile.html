<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./assets/site.css"></head><body class="bg-slate-950 text-white"><div class="mx-auto max-w-3xl p-4"><a class="font-black text-xl" href="index.html">TOPUP <span class="text-sky-400">UB</span> STORE</a><div id="profile" class="card mt-8"></div></div><script src="./js/api.js"></script><script src="./js/auth.js"></script><script src="./js/app.js"></script><script>requireLogin();(async()=>{try{const u=await getProfile();document.querySelector('#profile').innerHTML=`<h1 class="text-2xl font-bold">Profil</h1><div class="mt-5 space-y-3"><div>Nama<br><b>${esc(u.nama)}</b></div><div>Username<br><b>${esc(u.username)}</b></div><div>Email<br><b>${esc(u.email)}</b></div><div>Role<br><b>${esc(u.role)}</b></div></div>`}catch(e){toast(e.message,'error')}})();</script></body></html>
