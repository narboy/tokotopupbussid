<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./assets/site.css"></head><body class="bg-slate-950 text-white"><div class="mx-auto max-w-6xl p-4"><div class="flex items-center justify-between py-5"><a class="font-black text-xl" href="index.html">TOPUP <span class="text-sky-400">UB</span> STORE</a><div><a class="btn-secondary mr-2" href="topup.html">Top Up</a><button class="btn-primary" onclick="logout()">Logout</button></div></div><h1 id="hello" class="text-3xl font-black"></h1><div id="stats" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4"></div><div class="mt-8 grid gap-4 md:grid-cols-3"><a href="topup.html" class="card"><b>Top Up BUSSID</b><p class="mt-2 text-slate-400">Pilih nominal BUSSID.</p></a><a href="topup.html" class="card"><b>Top Up BUSSIN</b><p class="mt-2 text-slate-400">Pilih nominal BUSSIN.</p></a><a href="history.html" class="card"><b>Riwayat Pesanan</b><p class="mt-2 text-slate-400">Lihat status dan detail.</p></a></div></div><script src="./js/api.js"></script><script src="./js/auth.js"></script><script src="./js/app.js"></script><script>requireLogin();(async()=>{try{const u=await getProfile(),d=await apiRequest('getDashboard');document.querySelector('#hello').textContent='Halo, '+u.nama;document.querySelector('#stats').innerHTML=[['Total Pembelian',d.totalPembelian],['Pending',d.pending],['Berhasil',d.berhasil],['Pengeluaran',formatIDR(d.totalPengeluaran)]].map(x=>`<div class="card"><div class="text-sm text-slate-400">${x[0]}</div><div class="mt-2 text-2xl font-black">${x[1]}</div></div>`).join('')}catch(e){toast(e.message,'error')}})();</script></body></html>
