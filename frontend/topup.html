<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top Up</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./assets/site.css"></head><body class="bg-slate-950 text-white"><div class="mx-auto max-w-5xl p-4"><div class="py-5"><a class="font-black text-xl" href="index.html">TOPUP <span class="text-sky-400">UB</span> STORE</a></div><div class="grid gap-6 lg:grid-cols-[1.3fr_.7fr]"><div class="card"><h1 class="text-2xl font-bold">Checkout Top Up</h1><div class="mt-6 space-y-4"><select id="product"></select><input id="playerId" placeholder="Device ID / Player ID / Username Game" required><input id="promoCode" placeholder="Kode promo"><select id="paymentMethod"></select><button class="btn-primary w-full" onclick="createCheckoutOrder()">Buat Pesanan</button></div></div><div class="card"><div class="text-sm text-slate-400">Produk</div><div id="productName" class="mt-2 font-bold"></div><div class="mt-4 text-sm text-slate-400">Harga</div><div id="productPrice" class="mt-1 text-2xl font-black"></div><div class="mt-4 text-sm text-slate-400">Diskon</div><div id="discount" class="mt-1"></div><div class="mt-4 text-sm text-slate-400">Total</div><div id="total" class="mt-1 text-2xl font-black text-sky-300"></div></div></div></div><script src="./js/api.js"></script><script src="./js/auth.js"></script><script src="./js/app.js"></script><script src="./js/checkout.js"></script><script>requireLogin();(async()=>{try{checkoutProducts=await apiRequest('getProducts',{},'GET');promos=await apiRequest('getPromos',{},'GET');payments=await apiRequest('getPayments',{},'GET');const sel=document.querySelector('#product');sel.innerHTML=checkoutProducts.map(p=>`<option value="${esc(p.product_id)}">${esc(p.game)} • ${Number(p.coin).toLocaleString('id-ID')} Koin • ${formatIDR(p.price)}</option>`).join('');payments.forEach(p=>{});document.querySelector('#paymentMethod').innerHTML=payments.map(p=>`<option value="${esc(p.payment_id)}">${esc(p.category)} - ${esc(p.name)}</option>`).join('');function refresh(){selectedProduct=checkoutProducts.find(p=>p.product_id===sel.value);calculateCheckout()}sel.onchange=refresh;document.querySelector('#promoCode').oninput=calculateCheckout;refresh()}catch(e){toast(e.message,'error')}})();</script></body></html>
