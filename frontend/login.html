<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./assets/site.css"></head><body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4"><div class="w-full max-w-md card"><a href="index.html" class="font-black text-xl">TOPUP <span class="text-sky-400">UB</span> STORE</a><h1 class="mt-8 text-2xl font-bold">Masuk</h1><p class="mt-2 text-slate-400">Gunakan username atau email.</p><form id="form" class="mt-6 space-y-4"><input name="identifier" placeholder="Username / Email" required><input name="password" type="password" placeholder="Password" required><button class="btn-primary w-full">Login</button></form><p class="mt-5 text-sm text-slate-400">Belum punya akun? <a class="text-sky-300" href="register.html">Daftar</a></p></div><script src="./js/api.js"></script><script src="./js/auth.js"></script><script src="./js/app.js"></script><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);await login(f.get('identifier'),f.get('password'));location.href='dashboard.html'}catch(x){toast(x.message,'error')}};</script></body></html>
