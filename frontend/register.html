<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="./assets/site.css"></head><body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4"><div class="w-full max-w-md card"><a href="index.html" class="font-black text-xl">TOPUP <span class="text-sky-400">UB</span> STORE</a><h1 class="mt-8 text-2xl font-bold">Buat Akun</h1><form id="form" class="mt-6 space-y-4"><input name="nama" placeholder="Nama" required><input name="username" placeholder="Username" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><input name="confirmPassword" type="password" placeholder="Konfirmasi Password" required><button class="btn-primary w-full">Daftar</button></form><p class="mt-5 text-sm text-slate-400">Sudah punya akun? <a class="text-sky-300" href="login.html">Login</a></p></div><script src="./js/api.js"></script><script src="./js/auth.js"></script><script src="./js/app.js"></script><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);await register(Object.fromEntries(f.entries()));toast('Registrasi berhasil.','success');setTimeout(()=>location.href='login.html',800)}catch(x){toast(x.message,'error')}};</script></body></html>
